name: Deep Viet Hoa & Anti-Crash APKs

on:
  push:
    paths:
      - 'input/*.apk'
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Tên file APK trong thư mục input (để trống = file đầu tiên)'
        required: false
        default: ''
      strip_shared_uid:
        description: 'Gỡ sharedUserId (app hệ thống xe hay lỗi cài)'
        required: false
        default: false
        type: boolean
      skip_smali:
        description: 'Chỉ dịch XML, bỏ smali (KHUYẾN NGHỊ bật để tránh treo)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  deep-viethoa:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repo
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Cài đặt Python dịch thuật & zipalign
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zipalign
          pip install --upgrade pip >/dev/null 2>&1 || true
          # Dùng Google GTX qua urllib — không cần deep-translator

      - name: 4. Tải Apktool và Uber-APK-Signer
        run: |
          curl -L -s https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o apktool.jar
          curl -L -s https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o uber-apk-signer.jar

      - name: 5. Unpack, Dịch, Chống Văng, Align & Ký APK
        run: |
          set -e
          mkdir -p output

          if [ -n "${{ github.event.inputs.apk_name }}" ]; then
            APK_FILE="input/${{ github.event.inputs.apk_name }}"
          else
            APK_FILE=$(ls input/*.apk 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Không tìm thấy file APK trong input/"
            exit 1
          fi

          BASE_NAME=$(basename "$APK_FILE" .apk)
          echo "=== Xử lý: $APK_FILE ==="

          java -Xmx4G -jar apktool.jar d "$APK_FILE" -o decompiled_apk -f

          EXTRA_ARGS="--timeout-min 25 --max-strings 2500"
          SKIP_SMALI="${{ github.event.inputs.skip_smali }}"
          if [ -z "$SKIP_SMALI" ] || [ "$SKIP_SMALI" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --skip-smali"
          fi
          if [ "${{ github.event.inputs.strip_shared_uid }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --strip-shared-uid"
          fi

          echo "Args: $EXTRA_ARGS"
          python3 scripts/deep_translate.py --dir decompiled_apk $EXTRA_ARGS

          java -Xmx4G -jar apktool.jar b decompiled_apk --use-aapt2 -o "raw_${BASE_NAME}.apk" || \
          java -Xmx4G -jar apktool.jar b decompiled_apk -o "raw_${BASE_NAME}.apk"

          zipalign -p -f -v 4 "raw_${BASE_NAME}.apk" "unsigned_${BASE_NAME}.apk"

          java -jar uber-apk-signer.jar --apks "unsigned_${BASE_NAME}.apk" --skipZipAlign --out output/

          mv "output/unsigned_${BASE_NAME}-debugSigned.apk" "output/${BASE_NAME}_DeepVietHoa.apk" 2>/dev/null || \
          mv "output/unsigned_${BASE_NAME}-aligned-debugSigned.apk" "output/${BASE_NAME}_DeepVietHoa.apk" 2>/dev/null || \
          (ls -la output/ && exit 1)

          ls -lh "output/${BASE_NAME}_DeepVietHoa.apk"

      - name: 6. Commit APK thành phẩm
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.apk
          git commit -m "Viet hoa APK: $(date +'%Y-%m-%d %H:%M')" || echo "Không có thay đổi"
          git pull --rebase origin main || true
          git push
